[project]
name = "picorg"
version = "0.1.0"
description = "Deterministic photo organization and face-review pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
face = ["face-recognition>=1.3.0"]
insightface = ["insightface==0.7.3", "onnxruntime>=1.18,<2"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["*.py", "tests"]
exclude = [".cache", ".venv"]
typeCheckingMode = "basic"
