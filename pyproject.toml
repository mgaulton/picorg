[project]
name = "picorg"
version = "0.1.0"
description = "Deterministic photo organization and face-review pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]
review = ["Flask>=3.1,<4", "waitress>=3.0.2,<4"]
face = ["face-recognition>=1.3.0,<2", "numpy>=1.24,<3", "setuptools<81"]
insightface = ["insightface==0.7.3", "onnxruntime>=1.18,<2", "opencv-python-headless>=4.9,<5"]
uniface = ["uniface[cpu]>=4,<5"]
retrieval = ["faiss-cpu>=1.8,<2"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["*.py", "tests"]
exclude = [".cache", ".venv"]
typeCheckingMode = "basic"
